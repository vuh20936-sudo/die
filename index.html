
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Die Physics with Red 1 Dot - Three.js Example</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
<script>
// ----- Scene Setup -----
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

// Camera
const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(5, 7, 10);
camera.lookAt(0, 0, 0);

// Renderer
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Lighting
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(5, 8, 5);
scene.add(dirLight);

// ----- Ground -----
const groundGeo = new THREE.BoxGeometry(15, 0.2, 15);
const groundMat = new THREE.MeshPhongMaterial({color: 0xcccccc});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.position.y = -1.1;
scene.add(ground);

// ----- Die Construction -----
const dieSize = 2;
const dieGeo = new THREE.BoxGeometry(dieSize, dieSize, dieSize);
const dieMat = new THREE.MeshPhongMaterial({color: 0xffffff, shininess: 40});
const die = new THREE.Mesh(dieGeo, dieMat);
die.castShadow = true;
die.receiveShadow = true;

// Pip Placement for each face (+Z, -Z, +Y, -Y, +X, -X)
const pipConfigs = [
  // 1 (front)
  [{x: 0, y: 0, color: 0xff2222}],
  // 2 (back)
  [{x: -.5, y: -.5, color: 0x111111}, {x: .5, y: .5, color: 0x111111}],
  // 3 (top)
  [{x: -.5, y: -.5, color: 0x111111}, {x: 0, y: 0, color:0x111111}, {x:.5, y:.5, color:0x111111}],
  // 4 (bottom)
  [{x:-.5,y:-.5, color:0x111111}, {x:.5,y:-.5, color:0x111111}, {x:-.5,y:.5, color:0x111111}, {x:.5,y:.5, color:0x111111}],
  // 5 (right)
  [{x:-.5,y:-.5, color:0x111111}, {x:.5,y:-.5,color:0x111111}, {x:-.5,y:.5,color:0x111111},
    {x:.5,y:.5,color:0x111111}, {x:0,y:0, color:0x111111}],
  // 6 (left)
  [{x:-.5,y:-.5, color:0x111111}, {x:.5,y:-.5, color:0x111111}, {x:-.5,y:0, color:0x111111}, 
   {x:.5,y:0, color:0x111111}, {x:-.5,y:.5, color:0x111111}, {x:.5,y:.5, color:0x111111}],
];
// Face definitions: each entry is {normal axis, offset position}
const faceTransforms = [
  { axis: 'z', dir: +1 }, // +Z (front)
  { axis: 'z', dir: -1 }, // -Z (back)
  { axis: 'y', dir: +1 }, // +Y (top)
  { axis: 'y', dir: -1 }, // -Y (bottom)
  { axis: 'x', dir: +1 }, // +X (right)
  { axis: 'x', dir: -1 }, // -X (left)
];

const pipRadius = dieSize * 0.12;
const pipGeom = new THREE.SphereGeometry(pipRadius, 16, 16);

// Add pips (dots) to die
faceTransforms.forEach((face, i) => {
  const offset = dieSize/2 + 0.01;
  const pips = pipConfigs[i];
  pips.forEach(pip => {
    let pos = {x: 0, y: 0, z: 0};
    // pip.x and pip.y are [-0.5,0,0.5], center of face
    if(face.axis === 'x') {
      pos.x = face.dir * offset;
      pos.y = pip.y * dieSize * 0.5;
      pos.z = pip.x * dieSize * 0.5;
    } else if(face.axis === 'y') {
      pos.y = face.dir * offset;
      pos.z = pip.x * dieSize * 0.5;
      pos.x = pip.y * dieSize * 0.5;
    } else if(face.axis === 'z') {
      pos.z = face.dir * offset;
      pos.x = pip.x * dieSize * 0.5;
      pos.y = pip.y * dieSize * 0.5;
    }
    const mat = new THREE.MeshPhongMaterial({ color: pip.color });
    const pipMesh = new THREE.Mesh(pipGeom, mat);
    pipMesh.position.set(pos.x, pos.y, pos.z);
    die.add(pipMesh);
  });
});
scene.add(die);

// Initial position, velocity, and rotation
die.position.set(0, 3, 0);
let velocity = new THREE.Vector3(
  (Math.random() - 0.5) * 3,    // Random left/right
  -0.10,                        // Start gently falling
  (Math.random() - 0.5) * 3     // Random in/out
);
let angVel = new THREE.Vector3(
  Math.random() * 2,
  Math.random() * 2,
  Math.random() * 2
);

// ----- Physics & Animation -----
const gravity = -9.8;   // m/s^2
const bounce_damping = 0.53;
const groundY = ground.position.y + 0.1 + dieSize/2;
let lastTime = null;

function animate(time) {
  if(!lastTime) lastTime = time;
  const dt = Math.min((time - lastTime)/1000, 0.04); // s
  lastTime = time;

  // Physics integration
  velocity.y += gravity * dt;
  die.position.addScaledVector(velocity, dt);

  // Simple rotation integration
  die.rotation.x += angVel.x * dt;
  die.rotation.y += angVel.y * dt;
  die.rotation.z += angVel.z * dt;

  // Collision with ground
  if (die.position.y - dieSize/2 < ground.position.y + 0.1) {
    die.position.y = ground.position.y + 0.1 + dieSize/2;
    if (velocity.y < 0) velocity.y = -velocity.y * bounce_damping;
    // Friction & angular damping
    velocity.x *= 0.7; velocity.z *= 0.7;
    angVel.multiplyScalar(0.57);
    // Stop if very slow
    if (Math.abs(velocity.y) < 0.25) { velocity.y = 0; }
    if (angVel.length() < 0.1) angVel.set(0,0,0);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// Responsive resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
